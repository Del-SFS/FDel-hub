<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
        <link rel="manifest" href="/site.webmanifest">
        <link rel="shortcut icon" href="/favicon/favicon.ico" type="image/x-icon">
        <title>404</title>

        <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(to bottom,#070b18,#000);
            color:white;
            min-height:100vh;
            overflow-x:hidden;
        }


        #stars{
            position:fixed;
            width:100%;
            height:100%;
            top:0;
            left:0;
            z-index:-1;
        }

        .star{
            position:absolute;
            background:white;
            border-radius:50%;
            animation:twinkle infinite alternate;
        }

        @keyframes twinkle{
            from{
                opacity:0.2;
            }
            to{
                opacity:1;
            }
        }

        .container{
            width:90%;
            max-width:1200px;
            margin:auto;
            padding:40px 0;
        }

        /* Header */
        header{
            text-align:center;
            padding:80px 0;
        }

        header h1{
            font-size:4rem;
            margin-bottom:10px;
        }

        .subtitle{
            font-size:1.2rem;
            color:#bfbfbf;
            margin-bottom:15px;
        }

        .tagline{
            color:#8db9ff;
        }

        /* Seções */
        section{
            margin-bottom:40px;
        }

        .glass{
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:20px;
            padding:25px;
        }

        h2{
            margin-bottom:15px;
            color:#7ab8ff;
        }

        /* Cards */
        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:25px;
        }

        .card{
            text-decoration:none;
            color:white;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:20px;
            padding:30px;
            transition:all 0.3s ease;
        }  --

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 0 25px rgba(80,150,255,0.4);
        }

        .card h2{
            margin-bottom:15px;
            font-size:1.8rem;
        }

        .card p{
            color:#d0d0d0;
            line-height:1.6;
        }        
        footer{
            text-align:center;
            padding:30px 0;
            color:#888;
        }
                .download-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #1733b1;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: background-color 0.4s ease;
        }

        .download-btn:hover {
            background-color: #132da0c7;
         }
         .back{
        display:inline-block;
        margin-bottom:30px;
        color:#7ab8ff;
        text-decoration:none;
        }

    .back:hover{
        color:white;
    }
</style>
</head>
<body>

<div id="stars"></div>

<div class="container">

<a class="back" href="/">← Voltar ao Hub</a>

<section class="about glass">
    <h2>Pag não encontrada!</h2>
        <p>
            Ops... vc foi parar no void não tem nada aqui :(
            volte!
        </p>
</section>
<footer>
    © 2026 Del Hub
</footer>

</div>

<script>
const starsContainer = document.getElementById("stars");

for(let i = 0; i < 200; i++){

    const star = document.createElement("div");

    star.classList.add("star");

    const size = Math.random() * 3 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    star.style.animationDuration =
        (Math.random() * 4 + 1) + "s";

    starsContainer.appendChild(star);
}
</script>

</body>
</html>
